<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Fund, IDA and Gavi disbursements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="data.js"></script>
<script src="sources.js"></script>
<style>
  :root {
    --ink: #1B2533;
    --muted: #5B6676;
    --rule: #DDE2E8;
    --panel: #F3F5F8;
    --paper: #FFFFFF;
    --focus: #1F5FA8;
    --gf: #C8283E;
    --ida: #1F5FA8;
    --gavi: #0B8F80;
    /* Data sources (comparison sections) */
    --src-iati: #6250D6;
    --src-crs: #EB6834;
    --src-ihme: #1BAF7A;
    --src-ghed: #52514E;
    --font: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--font); font-size: 16px; line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  header { padding: 40px 0 8px; }
  h1 { font-size: clamp(1.6rem, 3vw, 2.25rem); line-height: 1.15; font-weight: 700;
       letter-spacing: -0.01em; margin: 0 0 10px; max-width: 26ch; }
  .lede { color: var(--muted); margin: 0; max-width: 70ch; }

  .funder-key { display: flex; flex-wrap: wrap; gap: 18px; margin: 22px 0 0; padding: 0; list-style: none; }
  .funder-key li { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .95rem; }
  .funder-key i { width: 22px; height: 4px; border-radius: 2px; display: inline-block; }

  nav[role="tablist"] { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin: 28px 0 0; }
  nav button {
    font: inherit; font-weight: 600; color: var(--muted); background: none; border: 0;
    padding: 12px 16px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }

  section[role="tabpanel"] { padding: 28px 0 48px; }
  section[hidden] { display: none; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 16px 24px; margin-bottom: 20px; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 600; color: var(--muted); }
  select {
    font: inherit; color: var(--ink); background: var(--paper); border: 1px solid #B9C2CE;
    border-radius: 6px; padding: 8px 10px; min-width: 240px;
  }
  .switch { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }

  .panels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .panel { background: var(--panel); border-radius: 10px; padding: 16px 12px 8px; }
  .panel h2 { font-size: 1.05rem; margin: 0 4px 2px; }
  .panel .total { font-size: .9rem; color: var(--muted); margin: 0 4px 6px; }
  .chart-sm { height: 300px; }

  h3 { font-size: 1.05rem; margin: 36px 0 10px; }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .93rem; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: .85rem; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.id a { color: var(--ida); font-size: .85rem; word-break: break-all; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: baseline; }

  .country-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
                  gap: 12px 24px; margin: 4px 0 6px; }
  .country-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; }
  .country-name { display: flex; align-items: center; gap: 12px; }
  .flag { width: 44px; height: 33px; border-radius: 3px; flex: none; object-fit: cover;
          box-shadow: 0 0 0 1px rgba(27, 37, 51, .15); align-self: center; }
  .country-head h2 { font-size: 1.6rem; margin: 0; }
  .locator { width: 260px; height: 132px; }
  .country-head .tag { color: var(--muted); }
  .country-head .big { font-size: 1.15rem; font-weight: 600; }
  .chart-lg { height: 440px; }
  .empty { background: var(--panel); border-radius: 10px; padding: 28px; color: var(--muted); }

  /* Country context */
  .context { margin-top: 44px; padding-top: 4px; }
  .context > h3 { margin-top: 0; }
  .ctx-groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 32px; }
  .ctx-group h4 { font-size: .9rem; font-weight: 600; color: var(--muted); margin: 14px 0 4px; }
  .ctx-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 84px; align-items: center;
             gap: 4px 12px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .ctx-label { font-size: .9rem; line-height: 1.3; }
  .ctx-value { text-align: right; white-space: nowrap; font-weight: 600; }
  .ctx-value small { display: block; font-weight: 400; color: var(--muted); font-size: .78rem; }
  .ctx-none { color: var(--muted); font-weight: 400; }
  .spark { width: 84px; height: 26px; display: block; }
  .ctx-health { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px;
                align-items: start; margin-top: 28px; }
  .ctx-health h4 { font-size: 1rem; margin: 0 0 4px; }
  .ctx-health p { color: var(--muted); font-size: .9rem; margin: 0; max-width: 46ch; }
  .chart-md { height: 300px; }
  .ctx-note { color: var(--muted); font-size: .82rem; margin: 16px 0 0; max-width: 90ch; }
  .ctx-note .dash { display: inline-block; width: 18px; border-top: 2px dashed var(--muted); vertical-align: middle; margin: 0 4px; }

  /* Data-source comparison */
  .src-block { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 20px 16px; margin: 0 0 36px; }
  .src-block > h2 { font-size: 1.2rem; margin: 0 0 4px; }
  .src-block .sub { color: var(--muted); margin: 0 0 14px; max-width: 80ch; font-size: .95rem; }
  .src-key { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 12px; padding: 0; list-style: none; font-size: .9rem; }
  .src-key li { display: flex; align-items: center; gap: 8px; }
  .src-key i { width: 22px; height: 0; border-top: 2px solid; display: inline-block; }
  .src-key i.dashed { border-top-style: dashed; }
  .src-panels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .src-panels .panel { padding-bottom: 4px; }
  .chart-src { height: 240px; }
  .chart-src-lg { height: 300px; }
  .verdict { background: var(--panel); border-radius: 10px; padding: 14px 16px; margin: 18px 0 0; }
  .verdict h3 { margin: 0 0 6px; font-size: 1rem; }
  .verdict p { margin: 0 0 6px; max-width: 90ch; }
  #src-table td:first-child { white-space: nowrap; }
  .src-table-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; margin: 18px 0 6px; }
  .src-table-head h3 { margin: 0; }
  .src-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 14px 0 0; }
  .src-stat { border-left: 3px solid; padding: 2px 0 2px 10px; }
  .src-stat b { display: block; font-size: 1.05rem; }
  .src-stat span { color: var(--muted); font-size: .85rem; }
  details.src-notes { margin: 14px 0 0; font-size: .88rem; color: var(--muted); }
  details.src-notes summary { cursor: pointer; font-weight: 600; color: var(--ink); }
  details.src-notes ul { margin: 8px 0 0; padding-left: 20px; max-width: 95ch; }
  details.src-notes li { margin-bottom: 4px; }
  .toolbar.sub-toolbar { margin-top: 4px; }

  footer { border-top: 1px solid var(--rule); padding: 20px 0 40px; color: var(--muted); font-size: .85rem; }
  footer p { max-width: 90ch; margin: 0 0 6px; }

  @media (max-width: 860px) {
    .panels { grid-template-columns: 1fr; }
    .ctx-groups, .ctx-health { grid-template-columns: 1fr; }
    .src-panels { grid-template-columns: 1fr; }
    .src-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .src-block { padding: 16px 12px 12px; }
    .locator { width: 160px; height: 82px; }
    select { min-width: 0; width: 100%; }
    label.field { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Disbursements from the Global Fund, World Bank IDA and Gavi</h1>
    <p class="lede" id="lede">Annual disbursements reported to IATI, in US dollars, to low and middle income countries.</p>
    <ul class="funder-key" aria-label="Funder colours">
      <li><i style="background:var(--gf)"></i>Global Fund</li>
      <li><i style="background:var(--ida)"></i>World Bank IDA</li>
      <li><i style="background:var(--gavi)"></i>Gavi</li>
    </ul>
  </header>

  <nav role="tablist" aria-label="Dashboard views">
    <button role="tab" id="tab-income" aria-controls="panel-income" aria-selected="true">By income group</button>
    <button role="tab" id="tab-country" aria-controls="panel-country" aria-selected="false" tabindex="-1">By country</button>
  </nav>

  <section role="tabpanel" id="panel-income" aria-labelledby="tab-income">
    <section class="src-block" id="src-income" aria-labelledby="src-income-title"></section>
    <div class="toolbar">
      <label class="switch"><input type="checkbox" id="shared-scale" checked> Same scale on all three charts</label>
    </div>
    <div class="panels" id="income-panels"></div>
    <h3>Total disbursed by funder and income group</h3>
    <div class="table-scroll"><table id="income-table"></table></div>
  </section>

  <section role="tabpanel" id="panel-country" aria-labelledby="tab-country" hidden>
    <div class="toolbar">
      <label class="field">Country
        <select id="country-select"></select>
      </label>
    </div>
    <div class="country-head" id="country-head"></div>
    <section class="src-block" id="src-country" aria-labelledby="src-country-title"></section>
    <div class="toolbar sub-toolbar">
      <label class="field">Funder
        <select id="funder-select">
          <option value="Global Fund">Global Fund</option>
          <option value="World Bank IDA">World Bank IDA</option>
          <option value="Gavi">Gavi</option>
          <option value="all">All three</option>
        </select>
      </label>
    </div>
    <div id="country-body"></div>
    <section class="context" id="country-context" aria-labelledby="ctx-title"></section>
    <div id="country-activities"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
(function () {
  const D = window.DASH;
  if (!D) {
    document.getElementById("income-panels").innerHTML =
      '<p class="empty">docs/data.js is missing. Run build_dashboard.R, then commit docs/data.js.</p>';
    return;
  }

  const COLORS = { "Global Fund": "#C8283E", "World Bank IDA": "#1F5FA8", "Gavi": "#0B8F80" };
  // Display name for each funder (e.g. "World Bank IDA (health)"), set by build_dashboard.R
  const label = f => ((D.meta.funder_labels || {})[f]) || f;
  document.querySelectorAll(".funder-key li").forEach((li, i) => {
    li.lastChild.textContent = label(D.funders[i]);
  });
  document.querySelectorAll("#funder-select option").forEach(o => {
    if (o.value !== "all") o.textContent = label(o.value);
  });
  document.querySelector("h1").textContent =
    "Disbursements from the " + D.funders.map(label).join(", ").replace(/, ([^,]*)$/, " and $1");
  const ACTIVITY_PALETTE = ["#1F5FA8", "#C8283E", "#0B8F80", "#E09F1F", "#6C4BA6",
                            "#3E8E41", "#D4568C", "#4F6D8A", "#9A6B3F", "#2BA3C4"];
  const OTHER_COLOR = "#B9C2CE";
  const TOP_N = 9;
  const years = [];
  for (let y = D.meta.start_year; y <= D.meta.end_year; y++) years.push(y);
  const thisYear = new Date().getFullYear();

  const fmt = v => {
    const a = Math.abs(v);
    if (a >= 1e9) return "$" + (v / 1e9).toFixed(a >= 1e10 ? 1 : 2) + "bn";
    if (a >= 1e6) return "$" + (v / 1e6).toFixed(a >= 1e8 ? 0 : 1) + "m";
    if (a >= 1e3) return "$" + (v / 1e3).toFixed(0) + "k";
    return "$" + Math.round(v);
  };
  const esc = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;

  const plotConfig = { displaylogo: false, responsive: true,
    modeBarButtonsToRemove: ["lasso2d", "select2d", "autoScale2d", "zoomIn2d", "zoomOut2d"] };
  const baseLayout = () => ({
    font: { family: "Public Sans, system-ui, sans-serif", color: "#1B2533", size: 12 },
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    margin: { l: 56, r: 12, t: 8, b: 36 },
    xaxis: { tickmode: "array", tickvals: years.filter(y => y % 2 === 1 || years.length < 8),
             showgrid: false, linecolor: "#B9C2CE", fixedrange: true },
    yaxis: { tickprefix: "$", exponentformat: "B", gridcolor: "#DDE2E8", zeroline: false, fixedrange: true },
    hovermode: "x unified", showlegend: false
  });

  // ---------- Header / footer copy ----------
  document.getElementById("lede").textContent =
    `Annual disbursements reported to IATI, in US dollars, ${D.meta.start_year}–${D.meta.end_year}, ` +
    `to countries classified as low, lower-middle or upper-middle income in the World Bank's ` +
    `${D.meta.classification} classification.`;
  document.getElementById("footer").innerHTML =
    `<p>Source: IATI data ${D.meta.source === "d-portal" ? "via d-portal, converted to US dollars at IMF rates" : "from the IATI Datastore"}, ` +
    `disbursements published by the Global Fund (47045), the World Bank (44000, IDA flows only) and Gavi (47122). ` +
    (D.meta.health_sectors
      ? `World Bank IDA is limited to health sectors (OECD DAC codes ${D.meta.health_sectors.join(", ")}); ` +
        `multi-sector projects count only their health share. `
      : "") +
    `Data built ${esc(D.meta.built)}.</p>` +
    `<p>Countries are grouped by their ${esc(D.meta.classification)} income classification for every year, ` +
    `not the classification at the time of disbursement. ` +
    `${D.meta.end_year >= thisYear ? D.meta.end_year + " is a partial year. " : ""}` +
    (D.meta.excluded_multi + D.meta.dropped_non_usd > 0
      ? `Excluded: ${D.meta.excluded_multi.toLocaleString()} multi-country disbursements and ` +
        `${D.meta.dropped_non_usd.toLocaleString()} without a US dollar value.`
      : "") + `</p>`;

  // ---------- Tabs ----------
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  function selectTab(tab, focus) {
    tabs.forEach(t => {
      const on = t === tab;
      t.setAttribute("aria-selected", on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
    });
    if (focus) tab.focus();
    if (tab.id === "tab-country") { renderCountry(); }
    else { renderIncome(); }
    updateHash();
  }
  tabs.forEach((t, i) => {
    t.addEventListener("click", () => selectTab(t));
    t.addEventListener("keydown", e => {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        const next = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
        selectTab(next, true);
      }
    });
  });

  // ---------- Tab 1: income groups ----------
  const incomeByKey = {};
  D.income.forEach(([f, g, y, v]) => { incomeByKey[`${f}|${g}|${y}`] = v; });
  const series = (f, g) => years.map(y => incomeByKey[`${f}|${g}|${y}`] || 0);

  const panelsEl = document.getElementById("income-panels");
  D.income_groups.forEach((g, i) => {
    const total = D.funders.reduce((s, f) => s + series(f, g).reduce((a, b) => a + b, 0), 0);
    panelsEl.insertAdjacentHTML("beforeend",
      `<div class="panel"><h2>${esc(g)}</h2><p class="total">${fmt(total)} since ${D.meta.start_year}</p>` +
      `<div class="chart-sm" id="income-chart-${i}" role="img" aria-label="Disbursements to ${esc(g)} countries by year and funder"></div></div>`);
  });

  function renderIncome() {
    renderSourcesIncome();
    const shared = document.getElementById("shared-scale").checked;
    let maxY = 0;
    D.income_groups.forEach(g => D.funders.forEach(f => {
      maxY = Math.max(maxY, ...series(f, g));
    }));
    D.income_groups.forEach((g, i) => {
      const traces = D.funders.map(f => ({
        x: years, y: series(f, g), name: f, type: "scatter", mode: "lines+markers",
        line: { color: COLORS[f], width: 2.5 }, marker: { size: 5 },
        hovertemplate: "%{customdata}<extra>" + esc(label(f)) + "</extra>",
        customdata: series(f, g).map(fmt)
      }));
      const layout = baseLayout();
      if (shared) layout.yaxis.range = [0, maxY * 1.06];
      else layout.yaxis.rangemode = "tozero";
      const el = document.getElementById(`income-chart-${i}`);
      Plotly.react(el, traces, layout, plotConfig);
    });
  }
  document.getElementById("shared-scale").addEventListener("change", renderIncome);

  // Totals table
  (function () {
    let html = "<thead><tr><th>Funder</th>" +
      D.income_groups.map(g => `<th class="num">${esc(g)}</th>`).join("") +
      '<th class="num">Total</th></tr></thead><tbody>';
    D.funders.forEach(f => {
      const vals = D.income_groups.map(g => series(f, g).reduce((a, b) => a + b, 0));
      html += `<tr><td><span class="swatch" style="background:${COLORS[f]}"></span>${esc(label(f))}</td>` +
        vals.map(v => `<td class="num">${fmt(v)}</td>`).join("") +
        `<td class="num"><strong>${fmt(vals.reduce((a, b) => a + b, 0))}</strong></td></tr>`;
    });
    document.getElementById("income-table").innerHTML = html + "</tbody>";
  })();


  // ---------- Country context (IMF WEO + World Bank WDI) ----------
  const CTX = D.context || null;
  const ctxMeta = {};
  if (CTX) CTX.indicators.forEach(([key, label, fmtType, group, source]) => {
    ctxMeta[key] = { key, label, fmt: fmtType, group, source };
  });
  const HEALTH_SOURCES = [
    ["gghe_pc", "#4F6D8A"], ["pvt_pc", "#C9A86A"], ["ext_pc", "#7A4FA8"]
  ];

  function fmtCtx(v, type) {
    if (v == null || isNaN(v)) return "–";
    switch (type) {
      case "people":
        return v >= 1e9 ? (v / 1e9).toFixed(2) + " billion"
             : v >= 1e6 ? (v / 1e6).toFixed(1) + " million"
             : Math.round(v).toLocaleString("en-US");
      case "usd":     return "$" + Math.round(v).toLocaleString("en-US");
      case "pct":     return v.toFixed(1) + "%";
      case "pct_gdp": return v.toFixed(1) + "% of GDP";
      case "years":   return v.toFixed(1) + " years";
      case "rate":    return Math.round(v).toString();
      default:        return String(v);
    }
  }

  // Small trend line; IMF projections drawn dashed after the last actual year
  function sparkline(series) {
    if (!series || series.length < 2) return '<svg class="spark" aria-hidden="true"></svg>';
    const W = 84, H = 26, P = 3;
    const xs = series.map(p => p[0]), ys = series.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    let y0 = Math.min(...ys), y1 = Math.max(...ys);
    if (y0 === y1) { y0 -= 1; y1 += 1; }
    const X = x => P + (x - x0) / (x1 - x0 || 1) * (W - 2 * P);
    const Y = y => H - P - (y - y0) / (y1 - y0) * (H - 2 * P);
    const pts = series.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`);
    const firstProj = series.findIndex(p => p[2] === 1);
    const actual = firstProj === -1 ? pts : pts.slice(0, firstProj);
    const proj = firstProj === -1 ? [] : pts.slice(Math.max(0, firstProj - 1));
    const last = series[(firstProj === -1 ? series.length : firstProj) - 1] || series[0];
    const zero = y0 < 0 && y1 > 0
      ? `<line x1="${P}" x2="${W - P}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#DDE2E8" stroke-width="1"/>` : "";
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">${zero}` +
      (actual.length > 1 ? `<polyline points="${actual.join(" ")}" fill="none" stroke="#1B2533" stroke-width="1.5"/>` : "") +
      (proj.length > 1 ? `<polyline points="${proj.join(" ")}" fill="none" stroke="#5B6676" stroke-width="1.5" stroke-dasharray="3 2"/>` : "") +
      `<circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="2.2" fill="#1B2533"/></svg>`;
  }

  function renderContext(iso2, name) {
    const el = document.getElementById("country-context");
    if (!CTX) { el.innerHTML = ""; return; }
    const vals = (CTX.values || {})[iso2] || {};
    const groups = ["Population", "Economy", "Health spending"];

    const groupHtml = groups.map(g => {
      const rowsHtml = Object.values(ctxMeta).filter(m => m.group === g).map(m => {
        const series = vals[m.key] || [];
        const actual = series.filter(p => p[2] !== 1);
        const latest = actual.length ? actual[actual.length - 1] : series[series.length - 1];
        const value = latest
          ? `${fmtCtx(latest[1], m.fmt)}<small>${latest[0]}${latest[2] === 1 ? ", IMF projection" : ""}</small>`
          : `<span class="ctx-none">No data</span>`;
        return `<div class="ctx-row"><span class="ctx-label">${esc(m.label)}</span>` +
          `<span class="ctx-value">${value}</span>${sparkline(series)}</div>`;
      }).join("");
      return `<div class="ctx-group"><h4>${esc(g)}</h4>${rowsHtml}</div>`;
    }).join("");

    // Health spending per person by source
    const hYears = [...new Set(HEALTH_SOURCES.flatMap(([k]) => (vals[k] || []).map(p => p[0])))].sort();
    const hasHealth = hYears.length > 0;
    const ext = vals.ext_share || [], lastExt = ext[ext.length - 1];
    const hText = hasHealth
      ? `Current health spending per person, split by who pays. ` +
        (lastExt ? `In ${lastExt[0]}, external sources financed ${lastExt[1].toFixed(0)}% of health spending in ${esc(name)}.` : "")
      : `No health spending data for ${esc(name)} in the World Development Indicators.`;

    const projYears = Object.values(vals).flat().filter(p => p[2] === 1).map(p => p[0]);
    el.innerHTML =
      `<h3 id="ctx-title">Country context</h3>` +
      `<div class="ctx-groups">${groupHtml}</div>` +
      `<div class="ctx-health"><div>` +
        (hasHealth ? `<div class="chart-md" id="ctx-health-chart" role="img" aria-label="Health spending per person by source in ${esc(name)}"></div>` : "") +
      `</div><div><h4>Who pays for health</h4><p>${hText}</p></div></div>` +
      `<p class="ctx-note">Economy: ${esc(CTX.sources.weo)}` +
        (projYears.length ? `; years after each indicator's latest actual data are IMF estimates or projections, drawn dashed<span class="dash"></span>` : "") +
        `. Population and health: ${esc(CTX.sources.wdi)}. Health spending data lag by two to three years.</p>`;

    if (hasHealth) {
      const traces = HEALTH_SOURCES.map(([k, color]) => {
        const byYear = Object.fromEntries((vals[k] || []).map(p => [p[0], p[1]]));
        const ys = hYears.map(y => byYear[y] ?? null);
        return { x: hYears, y: ys, type: "bar", name: ctxMeta[k].label, marker: { color },
                 customdata: ys.map(v => fmtCtx(v, "usd")),
                 hovertemplate: "%{customdata}<extra>" + esc(ctxMeta[k].label) + "</extra>" };
      });
      const layout = baseLayout();
      layout.barmode = "stack";
      layout.hovermode = "x unified";
      layout.showlegend = true;
      layout.legend = { orientation: "h", y: -0.18, x: 0, font: { size: 11 } };
      layout.xaxis.tickvals = hYears;
      layout.margin.b = 48;
      Plotly.newPlot(document.getElementById("ctx-health-chart"), traces, layout, plotConfig);
    }
  }

  // ---------- Country flag and locator map ----------
  const FLAG_URL = "https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/flags/4x3/";
  // Countries missing from Plotly's world map; marked by coordinates instead
  const MAP_POINTS = { XKX: [20.9, 42.6], TUV: [179.2, -8.5] };

  function renderLocator(iso3, name) {
    const el = document.getElementById("country-map");
    if (!el) return;
    if (!iso3 || typeof Plotly === "undefined") { el.hidden = true; return; }
    el.hidden = false;
    el.setAttribute("aria-label", `World map with ${name} highlighted`);
    const pt = MAP_POINTS[iso3];
    const traces = [
      { type: "choropleth", locationmode: "ISO-3", locations: [iso3], z: [1],
        colorscale: [[0, "#1B2533"], [1, "#1B2533"]], showscale: false,
        marker: { line: { color: "#1B2533", width: 0.5 } }, hoverinfo: "skip" },
      // Ring around the country so small states stay visible
      Object.assign(pt ? { lon: [pt[0]], lat: [pt[1]] } : { locationmode: "ISO-3", locations: [iso3] },
        { type: "scattergeo", mode: "markers", hoverinfo: "skip",
          marker: { size: 14, color: "rgba(0,0,0,0)", line: { color: "#1B2533", width: 2 } } })
    ];
    const layout = {
      margin: { l: 0, r: 0, t: 0, b: 0 }, paper_bgcolor: "rgba(0,0,0,0)", showlegend: false,
      geo: { projection: { type: "natural earth" }, resolution: 50,
             lataxis: { range: [-56, 84] }, lonaxis: { range: [-180, 180] },
             showframe: false, showcoastlines: false, showcountries: true,
             countrycolor: "#FFFFFF", countrywidth: 0.3,
             showland: true, landcolor: "#D3D9E1", showocean: false, bgcolor: "rgba(0,0,0,0)" }
    };
    Plotly.react(el, traces, layout, { staticPlot: true, responsive: true });
  }

  // ---------- Data-source comparison (docs/sources.js, from compare_sources.R) ----------
  const S = window.SOURCES || null;
  if (S) ["overlap_years", "ihme_prelim_years", "health_groups", "ihme_dropped_channels"]
    .forEach(k => { S.meta[k] = [].concat(S.meta[k] ?? []); });
  const SRC = [
    { key: "iati", i: 1, label: "IATI (d-portal)", short: "IATI", color: "#6250D6" },
    { key: "crs",  i: 2, label: "OECD CRS",        short: "CRS",  color: "#EB6834" },
    { key: "ihme", i: 3, label: "IHME DAH",        short: "IHME", color: "#1BAF7A" },
    { key: "ghed", i: 4, label: "WHO external health spending (reference)", short: "WHO", color: "#52514E", dash: true }
  ];
  const CAND = SRC.slice(0, 3);
  const srcName = k => SRC.find(s => s.key === k).label;
  const span = ys => ys.length ? (ys[0] === ys[ys.length - 1] ? ys[0] : ys[0] + "–" + ys[ys.length - 1]) : "";
  const SRC_ALL = "All low and middle income";

  const srcKeyHtml = () => '<ul class="src-key">' + SRC.map(s =>
    `<li><i class="${s.dash ? "dashed" : ""}" style="border-top-color:${s.color}"></i>${esc(s.label)}</li>`).join("") + "</ul>";

  const srcNotesHtml = () => {
    const m = S.meta;
    return `<details class="src-notes"><summary>About the sources and method</summary><ul>` +
      `<li><b>IATI (d-portal):</b> disbursements from every IATI publisher to each country in DAC sectors ` +
      `${m.health_groups.join(", ")} (health and population/reproductive health), split by each activity's ` +
      `country and sector percentages. Up to date, but reporting is voluntary and uneven, and money can be counted ` +
      `twice when a funder and the organisation implementing for it both publish.</li>` +
      `<li><b>OECD CRS:</b> health disbursements (purpose codes 121, 122, 123 and 130) reported by DAC members, ` +
      `multilaterals and some foundations; ODA and private development finance, excluding other official flows. ` +
      `Consistent definitions; published one to two years after the fact.</li>` +
      `<li><b>IHME DAH:</b> development assistance for health from all sources, including private, with transfers ` +
      `between channels removed to avoid double counting${m.ihme_dropped_channels.length ? "; " +
      esc(m.ihme_dropped_channels.join(", ").replace("WB_IBRD", "World Bank IBRD")) + " left out to match the aid definition" : ""}. ` +
      `${m.ihme_prelim_years.length ? span(m.ihme_prelim_years) + " figures are preliminary estimates." : ""}</li>` +
      `<li><b>WHO external health spending</b> (Global Health Expenditure Database): money from abroad recorded in ` +
      `each country's health accounts. Not a measure of aid disbursements, but an independent, recipient-side check.</li>` +
      `<li>All values are in constant ${m.base_year} US dollars: current-dollar figures (IATI, CRS, WHO) are deflated ` +
      `with the ${esc(m.deflator)}, and IHME's constant ${m.ihme_price_year} dollars are rebased with the same series. ` +
      `Agreement is measured over ${span(m.overlap_years)}, the years all three sources cover with final data, on ` +
      `country-years where both sources report. Income groups use the World Bank ${esc(m.classification)} classification for every year.</li>` +
      `</ul></details>`;
  };

  const srcEmptyHtml = (id, title) =>
    `<h2 id="${id}">${title}</h2><p class="sub">This comparison has not been built yet. Run ` +
    `<code>compare_sources.R</code> in R (it reads <code>CRS.parquet</code> and the IHME DAH folder from ` +
    `Downloads), then commit <code>docs/sources.js</code>.</p>`;

  // rows: [[year, iati, crs, ihme, ghed], ...] in USD millions
  function plotSources(el, rows, height) {
    const xs = rows.map(r => r[0]);
    const traces = [], ann = [];
    SRC.forEach(s => {
      const ys = rows.map(r => r[s.i] == null ? null : r[s.i] * 1e6);
      if (!ys.some(v => v != null)) return;
      traces.push({ x: xs, y: ys, type: "scatter", mode: "lines", name: s.label, connectgaps: false,
        line: { color: s.color, width: 2, dash: s.dash ? "dash" : "solid" },
        customdata: ys.map(v => v == null ? "" : fmt(v)),
        hovertemplate: "%{customdata}<extra>" + esc(s.short) + "</extra>" });
      const last = ys.reduce((k, v, j) => v == null ? k : j, -1);
      ann.push({ x: xs[last], y: ys[last], text: s.short, showarrow: false, xanchor: "left", xshift: 5,
                 font: { size: 11, color: "#5B6676" } });
    });
    // Keep end labels apart: at least ~9% of the value range between them
    const yMax = Math.max(0, ...traces.flatMap(t => t.y.filter(v => v != null)));
    const gap = yMax * 0.09;
    ann.sort((a, b) => a.y - b.y).forEach((a, j) => {
      if (j && a.y - ann[j - 1].y < gap) a.y = ann[j - 1].y + gap;
    });
    const layout = baseLayout();
    layout.margin.r = 40;
    layout.yaxis.rangemode = "tozero";
    layout.xaxis.tickvals = xs.filter(y => y % 2 === 1);
    layout.annotations = ann;
    el.style.height = height + "px";
    Plotly.react(el, traces, layout, plotConfig);
  }

  function srcVerdict(g) {
    const m = S.metrics[g];
    if (!m) return "";
    const yrs = span(S.meta.overlap_years), grp = g === SRC_ALL ? "low and middle income" : g.toLowerCase();
    const cons = CAND.map(s => [s.key, m.consistency[s.key]]).filter(x => x[1] != null).sort((a, b) => a[1] - b[1]);
    const who = CAND.map(s => [s.key, (m.pairs[s.key].ghed || {}).within25]).filter(x => x[1] != null).sort((a, b) => b[1] - a[1]);
    if (!cons.length) return "";
    const best = cons[0][0];
    let html = `<p>Over ${yrs}, <b>${esc(srcName(best))}</b> agrees most closely with the other two sources for ` +
      `${esc(grp)} countries: its country-year totals differ from theirs by a median of ${cons[0][1]}%, against ` +
      cons.slice(1).map(c => `${c[1]}% for ${esc(srcName(c[0]))}`).join(" and ") + ".</p>";
    if (who.length) {
      html += `<p>Against WHO external health spending, recorded by the countries themselves, <b>${esc(srcName(who[0][0]))}</b> ` +
        `is closest: within 25% in ${who[0][1]}% of country-years, against ` +
        who.slice(1).map(c => `${c[1]}% for ${esc(srcName(c[0]))}`).join(" and ") + ".</p>";
      html += who[0][0] === best
        ? `<p>On both tests, ${esc(srcName(best))} is the most reliable of the three for comparing total health aid across ${esc(grp)} countries.</p>`
        : `<p>The two tests point to different sources, so treat country rankings with care and check large gaps against both.</p>`;
    }
    const cov = S.meta.coverage, prelim = S.meta.ihme_prelim_years;
    let ihmeFinal = cov.ihme[1];
    while (prelim.includes(ihmeFinal) && ihmeFinal > cov.ihme[0]) ihmeFinal--;
    html += `<p>Latest year with data: IATI ${cov.iati[1]}, CRS ${cov.crs[1]}, IHME ${ihmeFinal}` +
      (prelim.length ? ` (${span(prelim)} preliminary)` : "") + `, WHO ${cov.ghed[1]}.</p>`;
    return html;
  }

  function srcTable(g) {
    const m = S.metrics[g];
    if (!m) return "";
    const pct = v => v == null ? "–" : v + "%";
    let html = '<thead><tr><th>Source</th><th class="num">Countries</th>' +
      '<th class="num">Median gap to the other two</th><th class="num">Within 25% of WHO external spending</th>' +
      '<th class="num">Total, relative to CRS</th><th class="num">Latest year</th></tr></thead><tbody>';
    CAND.forEach(s => {
      const p = m.pairs[s.key];
      const vsCrs = s.key === "crs" ? "–" : (p.crs && p.crs.ratio != null ? Math.round(p.crs.ratio * 100) + "%" : "–");
      html += `<tr><td><span class="swatch" style="background:${s.color}"></span>${esc(s.label)}</td>` +
        `<td class="num">${m.countries[s.key]}</td><td class="num">${pct(m.consistency[s.key])}</td>` +
        `<td class="num">${pct((p.ghed || {}).within25)}</td><td class="num">${vsCrs}</td>` +
        `<td class="num">${S.meta.coverage[s.key][1]}</td></tr>`;
    });
    return html + "</tbody>";
  }

  let srcIncomeBuilt = false;
  function renderSourcesIncome() {
    const el = document.getElementById("src-income");
    const title = "Total health aid by data source";
    if (!S) { el.innerHTML = srcEmptyHtml("src-income-title", title); return; }
    if (!srcIncomeBuilt) {
      const groups = Object.keys(S.metrics);
      el.innerHTML =
        `<h2 id="src-income-title">${title}</h2>` +
        `<p class="sub">Health aid disbursements to each income group as recorded by IATI, the OECD CRS and IHME, ` +
        `in constant ${S.meta.base_year} US dollars. Each line stops where that source's data run out.</p>` +
        srcKeyHtml() +
        '<div class="src-panels">' + D.income_groups.map((g, i) =>
          `<div class="panel"><h2>${esc(g)}</h2><div class="chart-src" id="src-chart-${i}" role="img" ` +
          `aria-label="Health aid to ${esc(g)} countries by data source and year"></div></div>`).join("") + "</div>" +
        '<div class="src-table-head"><h3>Which source is most reliable?</h3>' +
        '<label class="field">Income group<select id="src-group">' +
        groups.map(g => `<option${g === "Low income" ? " selected" : ""}>${esc(g)}</option>`).join("") +
        "</select></label></div>" +
        '<div class="verdict" id="src-verdict"></div>' +
        '<div class="table-scroll"><table id="src-table"></table></div>' + srcNotesHtml();
      const sel = document.getElementById("src-group");
      const upd = () => {
        document.getElementById("src-verdict").innerHTML = srcVerdict(sel.value);
        document.getElementById("src-table").innerHTML = srcTable(sel.value);
      };
      sel.addEventListener("change", upd);
      upd();
      srcIncomeBuilt = true;
    }
    D.income_groups.forEach((g, i) => {
      const rows = S.groups[g];
      if (rows) plotSources(document.getElementById(`src-chart-${i}`), rows, 240);
    });
  }

  function renderSourcesCountry(iso2, name) {
    const el = document.getElementById("src-country");
    const title = `Health aid to ${esc(name)} by data source`;
    if (!S) { el.innerHTML = srcEmptyHtml("src-country-title", title); return; }
    const rows = S.countries[iso2];
    if (!rows) {
      el.innerHTML = `<h2 id="src-country-title">${title}</h2><p class="sub">None of the sources records health aid to ${esc(name)}.</p>`;
      return;
    }
    // Totals over the comparison years, for the sources that report them
    const yrs = S.meta.overlap_years;
    const tot = {};
    SRC.forEach(s => {
      const v = rows.filter(r => yrs.includes(r[0]) && r[s.i] != null).map(r => r[s.i]);
      tot[s.key] = v.length ? v.reduce((a, b) => a + b, 0) * 1e6 : null;
    });
    const stats = SRC.map(s => {
      const rel = s.key !== "crs" && tot[s.key] != null && tot.crs ? `, ${Math.round(tot[s.key] / tot.crs * 100)}% of CRS` : "";
      return `<div class="src-stat" style="border-left-color:${s.color}"><b>${tot[s.key] == null ? "No data" : fmt(tot[s.key])}</b>` +
        `<span>${esc(s.short)}, ${span(yrs)}${rel}</span></div>`;
    }).join("");
    el.innerHTML =
      `<h2 id="src-country-title">${title}</h2>` +
      `<p class="sub">Health aid disbursements to ${esc(name)} in IATI, the OECD CRS and IHME, in constant ` +
      `${S.meta.base_year} US dollars, with WHO external health spending as a reference. ` +
      `For which source to rely on across countries, see the By income group tab.</p>` +
      srcKeyHtml() +
      `<div class="chart-src-lg" id="src-country-chart" role="img" aria-label="Health aid to ${esc(name)} by data source and year"></div>` +
      `<div class="src-stats">${stats}</div>` + srcNotesHtml();
    plotSources(document.getElementById("src-country-chart"), rows, 300);
  }

  // ---------- Tab 2: country ----------
  const rowsByCountry = {};
  D.rows.forEach(r => { (rowsByCountry[r[0]] = rowsByCountry[r[0]] || []).push(r); });
  const countryInfo = {};
  D.countries.forEach(([iso2, name, group, iso3]) => { countryInfo[iso2] = { name, group, iso3 }; });

  const countrySel = document.getElementById("country-select");
  const funderSel = document.getElementById("funder-select");
  D.income_groups.forEach(g => {
    const og = document.createElement("optgroup");
    og.label = g;
    D.countries.filter(c => c[2] === g).forEach(([iso2, name]) => {
      og.appendChild(new Option(name, iso2));
    });
    if (og.children.length) countrySel.appendChild(og);
  });

  function renderCountry() {
    const iso2 = countrySel.value, funder = funderSel.value;
    const info = countryInfo[iso2] || { name: iso2, group: "" };
    const funderLabel = funder === "all" ? "all three funders" : label(funder);
    const rows = (rowsByCountry[iso2] || []).filter(r => funder === "all" || r[1] === funder);

    // Aggregate by activity
    const acts = {};
    rows.forEach(([, f, id, y, v]) => {
      const a = acts[id] || (acts[id] = { id, funder: f, total: 0, byYear: {}, first: y, last: y });
      a.total += v; a.byYear[y] = (a.byYear[y] || 0) + v;
      a.first = Math.min(a.first, y); a.last = Math.max(a.last, y);
    });
    const list = Object.values(acts).sort((a, b) => b.total - a.total);
    const total = list.reduce((s, a) => s + a.total, 0);

    document.getElementById("country-head").innerHTML =
      `<div class="country-title"><div class="country-name">` +
      `<img class="flag" src="${FLAG_URL}${esc(iso2.toLowerCase())}.svg" alt="" onerror="this.remove()">` +
      `<h2>${esc(info.name)}</h2></div><span class="tag">${esc(info.group)}</span>` +
      `<span class="big">${fmt(total)} from ${esc(funderLabel)} since ${D.meta.start_year}</span></div>` +
      `<div class="locator" id="country-map" role="img"></div>`;
    renderLocator(info.iso3, info.name);
    renderSourcesCountry(iso2, info.name);

    const body = document.getElementById("country-body");
    const actsEl = document.getElementById("country-activities");
    renderContext(iso2, info.name);
    if (!list.length) {
      body.innerHTML = `<p class="empty">No disbursements from ${esc(funderLabel)} to ${esc(info.name)} ` +
        `are reported in IATI since ${D.meta.start_year}. Choose another funder or country.</p>`;
      actsEl.innerHTML = "";
      return;
    }

    body.innerHTML =
      `<div class="chart-lg" id="country-chart" role="img" aria-label="Disbursements to ${esc(info.name)} by year and activity"></div>`;
    actsEl.innerHTML =
      `<h3>Activities, largest first</h3><div class="table-scroll"><table id="activity-table"></table></div>`;

    // Stack the largest activities; group the rest as "Other activities"
    const top = list.slice(0, TOP_N), rest = list.slice(TOP_N);
    const colorFor = {};
    top.forEach((a, i) => { colorFor[a.id] = ACTIVITY_PALETTE[i % ACTIVITY_PALETTE.length]; });

    const traces = top.map(a => {
      const title = D.activities[a.id] || a.id;
      const ys = years.map(y => a.byYear[y] || 0);
      return {
        x: years, y: ys, type: "bar", name: esc(trunc(title, 60)),
        marker: { color: colorFor[a.id] },
        customdata: ys.map(fmt),
        hovertemplate: "%{customdata}<extra>" + esc(trunc(title, 50)) + "</extra>"
      };
    });
    if (rest.length) {
      const ys = years.map(y => rest.reduce((s, a) => s + (a.byYear[y] || 0), 0));
      traces.push({ x: years, y: ys, type: "bar", name: `Other activities (${rest.length})`,
        marker: { color: OTHER_COLOR }, customdata: ys.map(fmt),
        hovertemplate: "%{customdata}<extra>Other activities</extra>" });
    }
    const layout = baseLayout();
    layout.barmode = "stack";
    layout.hovermode = "closest";
    layout.showlegend = true;
    layout.legend = { orientation: "h", y: -0.14, x: 0, font: { size: 11 } };
    layout.margin.b = 40;
    layout.xaxis.tickvals = years;
    const chartEl = document.getElementById("country-chart");
    chartEl.style.height = (440 + Math.ceil(traces.length / 2) * 18) + "px";
    Plotly.newPlot(chartEl, traces, layout, plotConfig);

    // Activity table
    const showFunder = funder === "all";
    let html = "<thead><tr><th>Activity</th><th>IATI identifier</th>" +
      (showFunder ? "<th>Funder</th>" : "") +
      '<th class="num">Years</th><th class="num">Disbursed</th></tr></thead><tbody>';
    list.forEach(a => {
      const sw = colorFor[a.id] || OTHER_COLOR;
      html += `<tr><td><span class="swatch" style="background:${sw}"></span>${esc(D.activities[a.id] || a.id)}</td>` +
        `<td class="id"><a href="https://d-portal.org/ctrack.html#view=act&aid=${encodeURIComponent(a.id)}" ` +
        `target="_blank" rel="noopener">${esc(a.id)}</a></td>` +
        (showFunder ? `<td>${esc(label(a.funder))}</td>` : "") +
        `<td class="num">${a.first === a.last ? a.first : a.first + "–" + a.last}</td>` +
        `<td class="num">${fmt(a.total)}</td></tr>`;
    });
    document.getElementById("activity-table").innerHTML = html + "</tbody>";
  }

  countrySel.addEventListener("change", () => { renderCountry(); updateHash(); });
  funderSel.addEventListener("change", () => { renderCountry(); updateHash(); });

  // ---------- Shareable links: #country=KE&funder=Gavi ----------
  function updateHash() {
    const countryTab = document.getElementById("tab-country").getAttribute("aria-selected") === "true";
    const h = countryTab
      ? `#country=${countrySel.value}&funder=${encodeURIComponent(funderSel.value)}`
      : "#income";
    history.replaceState(null, "", h);
  }
  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.has("country") && countryInfo[p.get("country")]) countrySel.value = p.get("country");
    if (p.has("funder")) funderSel.value = p.get("funder");
    if (p.has("country")) return selectTab(document.getElementById("tab-country"));
    selectTab(document.getElementById("tab-income"));
  }
  readHash();
})();
</script>
</body>
</html>
